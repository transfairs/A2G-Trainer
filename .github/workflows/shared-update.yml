name: Update Shared

# Moves the Shared/ submodule to the newest commit of Anstoss-Trainer-Shared and keeps it if this
# trainer's tests pass. Started by the Shared repository's CI after every green push to its master
# (repository_dispatch), daily as a fallback, or by hand.
#   - tests pass: the update is committed to master and the online help is redeployed
#   - tests fail: the update goes to a branch with a pull request, master stays untouched
on:
  repository_dispatch:
    types: [shared-updated]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: shared-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-2022
    env:
      TESTS: A2G-Trainer-XP.Tests/A2G-Trainer-XP.Tests.csproj
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pull newest Shared
        id: pull
        shell: pwsh
        run: |
          $old = git -C Shared rev-parse --short HEAD
          git submodule update --remote Shared
          $new = git -C Shared rev-parse --short HEAD
          if ($old -eq $new) {
            Write-Host "Shared is already up to date ($old)."
            "changed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $log = git -C Shared log --pretty="- %s" "$old..$new"
          "changed=true" >> $env:GITHUB_OUTPUT
          "old=$old" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Set-Content -Path "$env:RUNNER_TEMP/shared-log.md" -Value ($log -join "`n") -Encoding utf8
          Write-Host "Shared $old -> $new"; $log

      - name: Setup MSBuild
        if: steps.pull.outputs.changed == 'true'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"

      - name: Setup .NET
        if: steps.pull.outputs.changed == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        id: test
        if: steps.pull.outputs.changed == 'true'
        continue-on-error: true
        run: |
          msbuild ${{ env.TESTS }} /t:Restore,Build /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test ${{ env.TESTS }} --configuration Release --no-build --no-restore

      - name: Commit to master
        if: steps.pull.outputs.changed == 'true' && steps.test.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add Shared
          $body = Get-Content "$env:RUNNER_TEMP/shared-log.md" -Raw
          git commit -m "Update Shared to ${{ steps.pull.outputs.new }}" -m $body
          git push origin HEAD:master
          # Pushes made with the workflow token don't start other workflows; start the help deploy
          # explicitly, since Shared also carries the help pages' stylesheet and script.
          gh workflow run pages.yml --ref master

      - name: Open pull request for the failing update
        if: steps.pull.outputs.changed == 'true' && steps.test.outcome != 'success'
        shell: pwsh
        run: |
          $branch = "shared-update/${{ steps.pull.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b $branch
          git add Shared
          $log = Get-Content "$env:RUNNER_TEMP/shared-log.md" -Raw
          git commit -m "Update Shared to ${{ steps.pull.outputs.new }}" -m $log
          git push origin $branch
          $body = "Das automatische Update von Shared (${{ steps.pull.outputs.old }} -> ${{ steps.pull.outputs.new }}) bricht die Tests dieses Trainers, master bleibt deshalb auf dem alten Stand.`n`nTestlauf: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`nÄnderungen in Shared:`n$log"
          gh pr create --base master --head $branch --title "Shared-Update ${{ steps.pull.outputs.new }} bricht die Tests" --body $body
          exit 1
